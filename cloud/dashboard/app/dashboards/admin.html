<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSoja | Administration Flotte</title>
    <link rel="icon" href="/assets/smart_soja_logo_vertical.png" type="image/png">
    <link rel="stylesheet" href="/src/css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Protection immédiate -->
    <script>
        const user = JSON.parse(localStorage.getItem('smartsoja_user'));
        if (!user) {
            window.location.href = '/login.html';
        }
    </script>
</head>

<body style="display: none;">
    <div class="dashboard-container">
        <!-- Header -->
        <header class="mobile-header">
            <div class="logo-area">
                <img src="/assets/smart_soja_logo_vertical.png" alt="Logo Smart Soja"
                    style="height: 55px; object-fit: contain;">
            </div>
            <div class="header-actions">
                <div class="status-badge status-online" role="status" aria-live="polite" aria-atomic="true">
                    <span class="status-dot animated"></span>
                    <span>Administrateur</span>
                </div>
                <!-- Theme Toggle -->
                <button class="theme-toggle" id="theme-toggle-btn" type="button" title="Changer de thème"
                    aria-label="Basculer le thème">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <button id="logout-btn" class="icon-button" type="button" aria-label="Se deconnecter"><i
                        data-lucide="log-out"></i></button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div id="dashboard-content">
                <!-- Injecté par admin.controller.js -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" aria-label="Navigation">
            <button class="nav-item active" data-section="overview" type="button" aria-label="Ouvrir l'accueil">
                <i data-lucide="layout-dashboard"></i>
                <span>Accueil</span>
            </button>
            <button class="nav-item" data-section="fleet" type="button" aria-label="Ouvrir la flotte">
                <i data-lucide="radio-tower"></i>
                <span>Flotte</span>
            </button>
            <button class="nav-item" data-section="industries" type="button" aria-label="Gerer les industries">
                <i data-lucide="building-2"></i>
                <span>Industries</span>
            </button>
            <button class="nav-item" data-section="users" type="button" aria-label="Ouvrir les utilisateurs">
                <i data-lucide="users"></i>
                <span>Utilisateurs</span>
            </button>
            <button class="nav-item" data-section="settings" type="button" aria-label="Ouvrir les réglages">
                <i data-lucide="settings"></i>
                <span>Réglages</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import adminController from '/src/js/controllers/admin.controller.js';

        document.addEventListener('DOMContentLoaded', () => {
            adminController.init();
        });
    </script>
</body>

</html>
