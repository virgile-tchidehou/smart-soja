<svg viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header { fill: #1E5A96; }
      .header-text { font: bold 22px sans-serif; fill: white; text-anchor: middle; }
      .axis { stroke: #1E293B; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; stroke-dasharray: 4,4; }
      .time-marker { stroke: #64748B; stroke-width: 1; }
      .task-label { font: bold 12px sans-serif; fill: #1E5A96; text-anchor: end; }
      .time-label { font: 11px sans-serif; fill: #64748B; text-anchor: middle; }
      .event-arrow { stroke: #EF4444; stroke-width: 2; stroke-dasharray: 3,3; fill: none; marker-end: url(#arrowhead-red); }
      .annotation { font: italic 11px sans-serif; fill: #C41E3A; font-weight: bold; }
      .info-text { font: 10px sans-serif; fill: #475569; }
      .legend-title { font: bold 12px sans-serif; fill: #1E5A96; }
      .priority-badge { font: bold 10px sans-serif; text-anchor: middle; }
    </style>

    <!-- Gradients pour chaque priorité -->
    <linearGradient id="prio4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="prio3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="prio2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="prio1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>

    <!-- Marqueurs -->
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1E293B" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EF4444" />
    </marker>

    <!-- Ombre -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================
       EN-TÊTE
       ============================================ -->
  <rect class="header" x="0" y="0" width="1600" height="70"/>
  <text class="header-text" x="800" y="45">Chronogramme d'Ordonnancement Préemptif FreeRTOS</text>

  <!-- ============================================
       AXES ET GRILLE
       ============================================ -->

  <!-- Axe Y (Tâches) -->
  <line class="axis" x1="250" y1="100" x2="250" y2="650"/>

  <!-- Axe X (Temps) -->
  <line class="axis" x1="250" y1="650" x2="1500" y2="650"/>
  <text class="time-label" x="1520" y="655">Temps (ms)</text>

  <!-- Lignes de grille et étiquettes des tâches -->
  <g id="tasks-grid">
    <!-- Task_Safety (P4 - Priorité max) -->
    <line class="grid-line" x1="250" y1="200" x2="1500" y2="200"/>
    <text class="task-label" x="230" y="205">P4 (Max)</text>
    <text class="task-label" x="230" y="220" style="font-size: 10px;">Task_Safety</text>

    <!-- Task_Control (P3) -->
    <line class="grid-line" x1="250" y1="330" x2="1500" y2="330"/>
    <text class="task-label" x="230" y="335">P3</text>
    <text class="task-label" x="230" y="350" style="font-size: 10px;">Task_Control</text>

    <!-- Task_Sensing (P2) -->
    <line class="grid-line" x1="250" y1="460" x2="1500" y2="460"/>
    <text class="task-label" x="230" y="465">P2</text>
    <text class="task-label" x="230" y="480" style="font-size: 10px;">Task_Sensing</text>

    <!-- Task_LCD/MQTT (P1 - Priorité min) -->
    <line class="grid-line" x1="250" y1="590" x2="1500" y2="590"/>
    <text class="task-label" x="230" y="595">P1 (Min)</text>
    <text class="task-label" x="230" y="610" style="font-size: 10px;">Task_LCD/MQTT</text>
  </g>

  <!-- Marqueurs de temps sur l'axe X -->
  <g id="time-markers">
    <line class="time-marker" x1="250" y1="645" x2="250" y2="655"/>
    <text class="time-label" x="250" y="675">0</text>

    <line class="time-marker" x1="400" y1="645" x2="400" y2="655"/>
    <text class="time-label" x="400" y="675">100</text>

    <line class="time-marker" x1="550" y1="645" x2="550" y2="655"/>
    <text class="time-label" x="550" y="675">200</text>

    <line class="time-marker" x1="700" y1="645" x2="700" y2="655"/>
    <text class="time-label" x="700" y="675">300</text>

    <line class="time-marker" x1="850" y1="645" x2="850" y2="655"/>
    <text class="time-label" x="850" y="675">400</text>

    <line class="time-marker" x1="1000" y1="645" x2="1000" y2="655"/>
    <text class="time-label" x="1000" y="675">500</text>

    <line class="time-marker" x1="1150" y1="645" x2="1150" y2="655"/>
    <text class="time-label" x="1150" y="675">600</text>

    <line class="time-marker" x1="1300" y1="645" x2="1300" y2="655"/>
    <text class="time-label" x="1300" y="675">700</text>

    <line class="time-marker" x1="1450" y1="645" x2="1450" y2="655"/>
    <text class="time-label" x="1450" y="675">800</text>
  </g>

  <!-- ============================================
       SCÉNARIO D'ORDONNANCEMENT (t=0 à t=800ms)
       ============================================ -->

  <!-- PHASE 1: t=0-150ms: Task_Sensing (P2) s'exécute seule -->
  <rect x="250" y="440" width="150" height="40" fill="url(#prio2)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="325" y="465" fill="white">Sensing</text>
  <text class="info-text" x="260" y="510">Lecture des capteurs</text>

  <!-- Événement 1: t=150ms - Task_Control arrive (P3 > P2) -->
  <path class="event-arrow" d="M 400 650 L 400 360"/>
  <circle cx="400" cy="650" r="4" fill="#EF4444"/>
  <text class="annotation" x="415" y="590">① Timer (150ms)</text>
  <text class="info-text" x="415" y="605">Task_Control arrive</text>

  <!-- PHASE 2: t=150-300ms: Task_Control (P3) PRÉEMPTE Sensing -->
  <rect x="400" y="310" width="150" height="40" fill="url(#prio3)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="475" y="335" fill="white">Control</text>
  <text class="info-text" x="410" y="380">Traitement des données</text>

  <!-- Flèche montrant que Sensing est suspendue -->
  <line x1="400" y1="485" x2="400" y2="500" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text class="info-text" x="410" y="545" style="fill:#999;">Sensing en attente...</text>

  <!-- Événement 2: t=300ms - Task_Safety arrive (P4 = MAX) -->
  <path class="event-arrow" d="M 550 650 L 550 220"/>
  <circle cx="550" cy="650" r="4" fill="#EF4444"/>
  <text class="annotation" x="565" y="240">② Interrupt (300ms)</text>
  <text class="info-text" x="565" y="255" style="fill:#B91C1C; font-weight:bold;">CRITIQUE: Task_Safety</text>

  <!-- PHASE 3: t=300-350ms: Task_Safety (P4) PRÉEMPTE TOUT -->
  <rect x="550" y="180" width="100" height="40" fill="url(#prio4)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="600" y="205" fill="white">Safety</text>
  <text class="info-text" x="565" y="275">Vérification sécurité</text>

  <!-- Flèche montrant que Control est suspendue -->
  <line x1="550" y1="335" x2="550" y2="350" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text class="info-text" x="560" y="300" style="fill:#999;">Control suspendue!</text>

  <!-- PHASE 4: t=350-450ms: Task_Control reprend (P3) -->
  <rect x="650" y="310" width="150" height="40" fill="url(#prio3)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="725" y="335" fill="white">Control</text>
  <text class="annotation" x="660" y="380">Reprise après Safety</text>

  <!-- PHASE 5: t=450-550ms: Task_Sensing reprend (P2) -->
  <rect x="800" y="440" width="150" height="40" fill="url(#prio2)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="875" y="465" fill="white">Sensing</text>
  <text class="annotation" x="810" y="510">Reprise après Control</text>

  <!-- Événement 3: t=550ms - Nouvelle interruption -->
  <path class="event-arrow" d="M 950 650 L 950 360"/>
  <circle cx="950" cy="650" r="4" fill="#EF4444"/>
  <text class="annotation" x="965" y="380">③ Event (550ms)</text>

  <!-- PHASE 6: t=550-600ms: Task_Control (P3) PRÉEMPTE Sensing -->
  <rect x="950" y="310" width="100" height="40" fill="url(#prio3)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="1000" y="335" fill="white">Control</text>

  <!-- PHASE 7: t=600-750ms: Task_LCD (P1) peut enfin s'exécuter -->
  <rect x="1050" y="570" width="200" height="40" fill="url(#prio1)" filter="url(#shadow)" rx="3"/>
  <text class="priority-badge" x="1150" y="595" fill="white">LCD/MQTT</text>
  <text class="info-text" x="1060" y="640">Affichage &amp; Communication</text>
  <text class="annotation" x="1060" y="625">(Tâche de fond - Aucune interruption)</text>

  <!-- ============================================
       LÉGENDE DES COULEURS
       ============================================ -->

  <g id="color-legend" transform="translate(250, 70)">
    <text class="legend-title" x="0" y="0">LÉGENDE DES PRIORITÉS:</text>

    <rect x="0" y="15" width="30" height="20" fill="url(#prio4)" rx="2"/>
    <text class="info-text" x="40" y="30" style="fill:#1E293B;">P4 (Priorité Max) = Critique &amp; Sécurité</text>

    <rect x="350" y="15" width="30" height="20" fill="url(#prio3)" rx="2"/>
    <text class="info-text" x="390" y="30" style="fill:#1E293B;">P3 = Contrôle &amp; Traitement</text>

    <rect x="700" y="15" width="30" height="20" fill="url(#prio2)" rx="2"/>
    <text class="info-text" x="740" y="30" style="fill:#1E293B;">P2 = Capteurs &amp; I/O</text>

    <rect x="1050" y="15" width="30" height="20" fill="url(#prio1)" rx="2"/>
    <text class="info-text" x="1090" y="30" style="fill:#1E293B;">P1 (Priorité Min) = Communication</text>
  </g>

</svg>