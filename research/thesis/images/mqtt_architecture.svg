<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E5A96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradLightBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E5A96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>

    <style>
      .comp-block { fill: white; stroke: #1E5A96; stroke-width: 1.5; rx: 8; }
      .comp-header { fill: url(#gradHeader); rx: 8 8 0 0; }
      .cloud-ellipse { fill: url(#gradLightBlue); stroke: #0284C7; stroke-width: 2; }
      .header-text { font: bold 13px sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .block-text { font: bold 12px sans-serif; fill: #0F172A; text-anchor: middle; dominant-baseline: middle; }
      .topic-label { font: 10px monospace; fill: #C41E3A; background: white; padding: 2px 4px; }
      .arrow { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-reverse { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrowhead-reverse); }
      .topic-text { font: 9px monospace; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .label-text { font: italic 11px sans-serif; font-weight: bold; }
      .publish-label { fill: #EF4444; }
      .subscribe-label { fill: #0284C7; }
      .small-text { font: bold 10px sans-serif; fill: #1E5A96; text-anchor: middle; }
    </style>
    
    <!-- Flèches -->
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B" />
    </marker>
    
    <marker id="arrowhead-reverse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#64748B" />
    </marker>
    
    <!-- Ombre -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- En-tête global -->
  <rect x="0" y="0" width="1400" height="60" fill="url(#gradHeader)"/>
  <text x="700" y="30" font-family="sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    Architecture de Communication MQTT : SMART-SOJA
  </text>
  <text x="700" y="50" font-family="sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">
    Flux de données en temps réel via Broker Cloud HiveMQ
  </text>
  <!-- ESP32 (Unité Edge) -->
  <rect class="comp-block" x="100" y="300" width="200" height="120" filter="url(#shadow)"/>
  <rect class="comp-header" x="100" y="300" width="200" height="30"/>
  <text class="header-text" x="200" y="315">UNITÉ EDGE</text>
  <text class="block-text" x="200" y="360">ESP32</text>
  <text class="small-text" x="200" y="400">Client ID: SMART_SOJA_01</text>

  <!-- MQTT Broker (Cloud) -->
  <ellipse class="cloud-ellipse" cx="700" cy="350" rx="140" ry="110" filter="url(#shadow)"/>
  <text class="block-text" x="700" y="335" style="font-size: 14px; fill: #1E5A96;">BROKER MQTT</text>
  <text class="block-text" x="700" y="365" style="font-weight: normal;">(HiveMQ Cloud)</text>

  <!-- Dashboard WEB -->
  <rect class="comp-block" x="1050" y="140" width="200" height="120" filter="url(#shadow)"/>
  <rect class="comp-header" x="1050" y="140" width="200" height="30"/>
  <text class="header-text" x="1150" y="155">APPLICATION</text>
  <text class="block-text" x="1150" y="195">Dashboard WEB</text>
  <text class="small-text" x="1150" y="235">(Vite.js / Vanilla JS)</text>

  <!-- Firebase Realtime DB -->
  <rect class="comp-block" x="1050" y="300" width="200" height="120" filter="url(#shadow)"/>
  <rect class="comp-header" x="1050" y="300" width="200" height="30"/>
  <text class="header-text" x="1150" y="315">BASE DE DONNÉES</text>
  <text class="block-text" x="1150" y="360">Firebase</text>
  <text class="small-text" x="1150" y="400">Realtime Database</text>

  <!-- API Node.js -->
  <rect class="comp-block" x="1050" y="460" width="200" height="120" filter="url(#shadow)"/>
  <rect class="comp-header" x="1050" y="460" width="200" height="30"/>
  <text class="header-text" x="1150" y="475">BACKEND API</text>
  <text class="block-text" x="1150" y="520">Node.js</text>
  <text class="small-text" x="1150" y="560">Express Server</text>

  <!-- ============================================
       LIAISONS / TOPICS
       ============================================ -->

  <!-- ESP32 to Broker: soja/data/batch (PUBLISH) -->
  <path class="arrow" d="M 300 330 L 560 330"/>
  <rect x="370" y="320" width="120" height="20" fill="#EF4444" rx="3" filter="url(#shadow)"/>
  <text class="topic-text" x="430" y="330">soja/data/batch</text>

  <!-- ESP32 to Broker: soja/status (PUBLISH) -->
  <path class="arrow" d="M 300 360 L 560 360"/>
  <rect x="370" y="350" width="120" height="20" fill="#EF4444" rx="3" filter="url(#shadow)"/>
  <text class="topic-text" x="430" y="360">soja/status</text>

  <!-- Broker to ESP32: soja/cmd (SUBSCRIBE) -->
  <path class="arrow" d="M 560 390 L 300 390"/>
  <rect x="370" y="380" width="120" height="20" fill="#0284C7" rx="3" filter="url(#shadow)"/>
  <text class="topic-text" x="430" y="390">soja/cmd</text>

  <!-- Broker to Dashboard -->
  <path class="arrow" d="M 840 330 L 945 330 L 945 200 L 1050 200"/>
  <text class="label-text subscribe-label" x="900" y="325">Subscribe</text>

  <!-- Broker to Firebase -->
  <path class="arrow" d="M 840 360 L 1050 360"/>
  <text class="label-text subscribe-label" x="900" y="355">Subscribe</text>

  <!-- Broker to API -->
  <path class="arrow" d="M 840 370 L 945 370 L 945 520 L 1050 520"/>
  <text class="label-text subscribe-label" x="900" y="365">Subscribe</text>

  <!-- ============================================
       LÉGENDES
       ============================================ -->

  <!-- PUBLISH Label -->
  <text class="label-text publish-label" x="350" y="120">PUBLISH</text>

  <!-- SUBSCRIBE Label -->
  <text class="label-text subscribe-label" x="920" y="120">SUBSCRIBE</text>

  <!-- Titre/Caption -->
  <text style="font: bold 13px sans-serif; fill: #333; text-anchor: middle;" x="700" y="750">
    Architecture de communication MQTT : Flux de données temps réel
  </text>

  <!-- Boîtes de contexte informatives -->
  <text style="font: bold 12px sans-serif; fill: #1E5A96;" x="200" y="470">CAPTEURS &amp; CONTRÔLE</text>
  <text style="font: bold 12px sans-serif; fill: #1E5A96;" x="700" y="490">ROUTEUR CENTRAL (BROKER)</text>
  <text style="font: bold 12px sans-serif; fill: #1E5A96;" x="1150" y="620">SERVICES CLOUD</text>

</svg>