<svg viewBox="0 0 1100 950" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .init-step { fill: white; stroke: #1E5A96; stroke-width: 2.5; }
      .init-step-inner { fill: none; stroke: #1E5A96; stroke-width: 1.5; }
      .step { fill: white; stroke: #1E293B; stroke-width: 2; }
      .step-text { font: bold 14px Arial, sans-serif; fill: #1E5A96; text-anchor: middle; dominant-baseline: central; }
      .label-text { font: 13px Arial, sans-serif; fill: #334155; }
      .transition-line { stroke: #1E293B; stroke-width: 1.8; fill: none; }
      .transition-bar { stroke: #1E293B; stroke-width: 2.5; fill: none; }
      .receptivity { font: italic 11px Arial, sans-serif; fill: #C41E3A; font-weight: bold; }
      .receptivity-bg { fill: white; stroke: #EF4444; stroke-width: 0.5; rx: 3; }
      .arrow { fill: none; stroke: #1E293B; stroke-width: 1.8; marker-end: url(#arrowhead); }
      .arrow-red { fill: none; stroke: #C41E3A; stroke-width: 1.8; marker-end: url(#arrowhead-red); }
      .title { font: bold 18px Arial, sans-serif; fill: #1E5A96; text-anchor: middle; }
      .caption { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>

    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1E293B" />
    </marker>
    <marker id="arrowhead-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C41E3A" />
    </marker>
  </defs>

  <!-- Fond Blanc -->
  <rect x="0" y="0" width="1100" height="950" fill="white"/>



  <!-- ============================================
       ÉTAPES ET TRANSITIONS
       ============================================ -->

  <!-- ÉTAPE 0 -->
  <rect class="init-step" x="500" y="100" width="50" height="50" rx="4"/>
  <rect class="init-step-inner" x="504" y="104" width="42" height="42" rx="3"/>
  <text class="step-text" x="525" y="125">0</text>
  <text class="label-text" x="565" y="125">Veille / Attente</text>

  <!-- Transition 0 -> 1 -->
  <line class="transition-line" x1="525" y1="150" x2="525" y2="200"/>
  <line class="transition-bar" x1="515" y1="175" x2="535" y2="175"/>
  <text class="receptivity" x="545" y="179">Appui START</text>

  <!-- ÉTAPE 1 -->
  <rect class="step" x="500" y="200" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="225">1</text>
  <text class="label-text" x="565" y="225">Vérification présence soja</text>

  <!-- Transition 1 -> 2 -->
  <line class="transition-line" x1="525" y1="250" x2="525" y2="300"/>
  <line class="transition-bar" x1="515" y1="275" x2="535" y2="275"/>
  <text class="receptivity" x="545" y="279">Soja détecté</text>

  <!-- ÉTAPE 2 -->
  <rect class="step" x="500" y="300" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="325">2</text>
  <text class="label-text" x="565" y="325">Alimentation (Ouverture trémie)</text>

  <!-- Transition 2 -> 3 -->
  <line class="transition-line" x1="525" y1="350" x2="525" y2="400"/>
  <line class="transition-bar" x1="515" y1="375" x2="535" y2="375"/>
  <text class="receptivity" x="545" y="379">Trémie vide</text>

  <!-- ÉTAPE 3 -->
  <rect class="step" x="500" y="400" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="425">3</text>
  <text class="label-text" x="565" y="425">Nettoyage et Tamisage</text>

  <!-- Transition 3 -> 4 -->
  <line class="transition-line" x1="525" y1="450" x2="525" y2="500"/>
  <line class="transition-bar" x1="515" y1="475" x2="535" y2="475"/>
  <text class="receptivity" x="545" y="479">Nettoyage fini</text>

  <!-- ÉTAPE 4 -->
  <rect class="step" x="500" y="500" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="525">4</text>
  <text class="label-text" x="565" y="525">Analyse de l'humidité</text>

  <!-- ============================================
       DIVERGENCE ET CONVERGENCE EN OU
       ============================================ -->
  
  <!-- Ligne de divergence -->
  <line class="transition-line" x1="525" y1="550" x2="525" y2="570"/>
  <line class="transition-bar" x1="375" y1="570" x2="675" y2="570"/>

  <!-- Branche GAUCHE (Séchage) -->
  <line class="transition-line" x1="400" y1="570" x2="400" y2="630"/>
  <line class="transition-bar" x1="390" y1="595" x2="410" y2="595"/>
  <text class="receptivity" x="290" y="595" text-anchor="end">Humidité > 12%</text>

  <rect class="step" x="375" y="630" width="50" height="50" rx="4"/>
  <text class="step-text" x="400" y="655">5</text>
  <text class="label-text" x="435" y="650">Séchage et Brassage</text>

  <!-- Branche DROITE (Saut) -->
  <line class="transition-line" x1="650" y1="570" x2="650" y2="730"/>
  <line class="transition-bar" x1="640" y1="595" x2="660" y2="595"/>
  <text class="receptivity" x="670" y="595">Humidité ≤ 12%</text>

  <!-- Fin de branche gauche vers convergence -->
  <line class="transition-line" x1="400" y1="680" x2="400" y2="730"/>
  <line class="transition-bar" x1="390" y1="705" x2="410" y2="705"/>
  <text class="receptivity" x="290" y="705" text-anchor="end">Séchage fini</text>

  <!-- Ligne de convergence -->
  <line class="transition-bar" x1="375" y1="730" x2="675" y2="730"/>
  <line class="transition-line" x1="525" y1="730" x2="525" y2="760"/>

  <!-- ÉTAPE 6 -->
  <rect class="step" x="500" y="760" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="785">6</text>
  <text class="label-text" x="565" y="785">Transfert vers pesée</text>

  <!-- Transition 6 -> 7 -->
  <line class="transition-line" x1="525" y1="810" x2="525" y2="840"/>
  <line class="transition-bar" x1="515" y1="825" x2="535" y2="825"/>
  <text class="receptivity" x="545" y="829">Transfert fini</text>

  <!-- ÉTAPE 7 -->
  <rect class="step" x="500" y="840" width="50" height="50" rx="4"/>
  <text class="step-text" x="525" y="865">7</text>
  <text class="label-text" x="565" y="865">Pesage final</text>

  <!-- BOUCLE DE RETOUR -->
  <line class="transition-line" x1="525" y1="890" x2="525" y2="930"/>
  <line class="transition-bar" x1="515" y1="910" x2="535" y2="910"/>
  <text class="receptivity" x="545" y="914">Cycle terminé</text>

  <path class="arrow-red" d="M 525 930 L 525 940 L 150 940 L 150 125 L 500 125" fill="none"/>
  <text class="receptivity" x="160" y="120">Retour initial</text>

  <!-- ============================================
       LÉGENDE VERTICALE (À GAUCHE)
       ============================================ -->
  <g id="legend" transform="translate(10, 150)">
    <text class="label-text" x="0" y="0" style="font-weight: bold; fill: #1E5A96;">Légende :</text>

    <!-- Étape normale -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="25" height="25" fill="white" stroke="#1E293B" stroke-width="1.5" rx="2"/>
      <text class="step-text" x="12.5" y="12.5" style="font-size: 10px;">n</text>
      <text class="label-text" x="35" y="17">Étape active</text>
    </g>

    <!-- Étape initiale -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="25" height="25" fill="white" stroke="#1E5A96" stroke-width="2" rx="2"/>
      <rect x="2" y="2" width="21" height="21" fill="none" stroke="#1E5A96" stroke-width="1" rx="1"/>
      <text class="step-text" x="12.5" y="12.5" style="font-size: 10px;">0</text>
      <text class="label-text" x="35" y="17">Étape initiale</text>
    </g>

    <!-- Transition -->
    <g transform="translate(0, 110)">
      <line x1="12.5" y1="0" x2="12.5" y2="25" stroke="#1E293B" stroke-width="2"/>
      <line x1="2.5" y1="12.5" x2="22.5" y2="12.5" stroke="#1E293B" stroke-width="2.5"/>
      <text class="label-text" x="35" y="17">Transition</text>
    </g>

    <!-- Réceptivité -->
    <g transform="translate(0, 150)">
      <text class="receptivity" x="0" y="17">Condition / Réceptivité</text>
    </g>

    <!-- Boucle de retour -->
    <g transform="translate(0, 190)">
      <line x1="0" y1="12.5" x2="25" y2="12.5" stroke="#C41E3A" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
      <text class="label-text" x="35" y="17">Boucle de retour</text>
    </g>
  </g>

</svg>